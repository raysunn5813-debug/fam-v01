<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ family_label }} Family Chat</title>
    <style>
        :root { color-scheme: light; font-family: Inter, Arial, sans-serif; color: #302d29; background: #f9f6f0; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; }
        main { margin: 0 auto; max-width: 760px; padding: 2rem 1rem 4rem; }
        nav { margin-bottom: 2rem; }
        a { color: #745344; }
        h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(2rem, 7vw, 3.5rem); font-weight: 400; margin: 0.4rem 0; }
        .eyebrow { color: #786c60; font-size: 0.75rem; letter-spacing: 0.16em; text-transform: uppercase; }
        .description, .status { color: #786c60; line-height: 1.6; }
        .log { background: #fff; border: 1px solid #e4ded5; display: grid; gap: 0.8rem; margin: 1.5rem 0; max-height: 55vh; min-height: 200px; overflow-y: auto; padding: 1rem; }
        .message { background: #f9f6f0; overflow-wrap: anywhere; padding: 0.8rem; }
        .message header { align-items: baseline; display: flex; gap: 1rem; justify-content: space-between; }
        .identity { align-items: center; display: flex; gap: 0.65rem; }
        .avatar { align-items: center; background: #e9e1d7; border-radius: 50%; color: #5c4033; display: inline-flex; flex: 0 0 2.5rem; height: 2.5rem; justify-content: center; object-fit: cover; width: 2.5rem; }
        time { color: #786c60; font-size: 0.75rem; }
        .message p { line-height: 1.5; margin: 0.5rem 0 0; white-space: pre-wrap; }
        form { display: grid; gap: 0.75rem; }
        label { font-size: 0.9rem; }
        textarea { border: 1px solid #d5cec3; font: inherit; min-height: 110px; padding: 0.75rem; resize: vertical; }
        button { background: #5c4033; border: 1px solid #5c4033; color: white; cursor: pointer; font: inherit; justify-self: start; padding: 0.7rem 1.2rem; }
        button:disabled { cursor: wait; opacity: 0.65; }
        .error { color: #a3332a; }
        @media (max-width: 480px) { .message header { align-items: flex-start; flex-direction: column; gap: 0.2rem; } }
    </style>
</head>
<body>
    <main>
        <nav><a href="/welcome">← Back to family welcome page</a> · <a href="/family/{{ family }}/stories">Family stories</a> · <a href="/profile">My profile</a></nav>
        <p class="eyebrow">Stay connected</p>
        <h1>{{ family_label }} Family Chat</h1>
        <p class="description">Share a message with signed-in members of this family.</p>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <section id="chat-log" class="log" role="log" aria-live="polite"></section>
        <form id="chat-form">
            <label for="message">Your message</label>
            <textarea id="message" name="message" maxlength="2000" required></textarea>
            <button type="submit">Send message</button>
        </form>
    </main>
    <script>
        const family = {{ family|tojson }};
        const log = document.getElementById('chat-log');
        const status = document.getElementById('status');
        const form = document.getElementById('chat-form');

        function showError(error) {
            status.textContent = error.message;
            status.classList.add('error');
        }

        async function loadMessages() {
            const response = await fetch(`/api/chat/${family}`);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Unable to load family chat.');
            log.replaceChildren();
            if (!data.messages.length) {
                status.textContent = 'No messages yet. Start the conversation.';
            } else {
                status.textContent = '';
            }
            status.classList.remove('error');
            data.messages.forEach(message => {
                const item = document.createElement('article');
                item.className = 'message';
                const header = document.createElement('header');
                const identity = document.createElement('div');
                identity.className = 'identity';
                const fallbackAvatar = document.createElement('span');
                fallbackAvatar.className = 'avatar';
                fallbackAvatar.setAttribute('aria-hidden', 'true');
                fallbackAvatar.textContent = message.author.trim().slice(0, 1).toUpperCase() || '?';
                if (message.avatar_url) {
                    const avatar = document.createElement('img');
                    avatar.className = 'avatar';
                    avatar.src = message.avatar_url;
                    avatar.alt = `${message.author}'s profile picture`;
                    avatar.onerror = () => avatar.replaceWith(fallbackAvatar);
                    identity.appendChild(avatar);
                } else {
                    identity.appendChild(fallbackAvatar);
                }
                const author = document.createElement('strong');
                author.textContent = message.author;
                identity.appendChild(author);
                const timestamp = document.createElement('time');
                const date = new Date(message.created_at);
                timestamp.dateTime = message.created_at;
                timestamp.textContent = Number.isNaN(date.getTime()) ? '' : date.toLocaleString();
                const text = document.createElement('p');
                text.textContent = message.text;
                header.append(identity, timestamp);
                item.append(header, text);
                log.appendChild(item);
            });
            log.scrollTop = log.scrollHeight;
        }

        async function getCsrfToken() {
            const response = await fetch('/api/csrf');
            const data = await response.json();
            if (!response.ok || !data.csrf_token) throw new Error(data.error || 'Unable to verify your request.');
            return data.csrf_token;
        }

        form.addEventListener('submit', async event => {
            event.preventDefault();
            const button = form.querySelector('button');
            button.disabled = true;
            status.textContent = 'Sending message…';
            status.classList.remove('error');
            try {
                const csrfToken = await getCsrfToken();
                const response = await fetch(`/api/chat/${family}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
                    body: JSON.stringify({ message: form.elements.message.value })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Unable to send message.');
                form.reset();
                await loadMessages();
            } catch (error) {
                showError(error);
            } finally {
                button.disabled = false;
            }
        });

        loadMessages().catch(showError);
        window.setInterval(() => loadMessages().catch(showError), 10000);
    </script>
</body>
</html>
